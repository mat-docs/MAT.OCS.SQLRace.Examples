name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore projects/csharp/SqlRace.Examples.sln
        env:
          NUGET_AUTH_USERNAME: ${{ secrets.PACKAGES_USERNAME }}
          NUGET_AUTH_TOKEN: ${{ secrets.PACKAGES_PATTOKEN }}

      - name: Build solution
        run: dotnet build projects/csharp/SqlRace.Examples.sln --no-restore --configuration Release

      # NOTE: Tests are NOT executed in CI. Several tests initialise the SQL Race
      # runtime via SqlRaceBootstrapper, which requires a SQL Race licence that the
      # CI runner does not have (LicenceException). CI verifies compilation only;
      # run `dotnet test` locally on a licenced machine to execute the test suite.
