name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore projects
        run: dotnet restore projects/csharp/SqlRace.Examples.sln
        env:
          NUGET_AUTH_USERNAME: ${{ secrets.PACKAGES_USERNAME }}
          NUGET_AUTH_TOKEN: ${{ secrets.PACKAGES_PATTOKEN }}

      - name: Build projects
        run: dotnet build projects/csharp/SqlRace.Examples.sln --no-restore --configuration Release

      - name: Restore tests
        run: dotnet restore tests/SqlRace.Examples.Tests/SqlRace.Examples.Tests.csproj
        env:
          NUGET_AUTH_USERNAME: ${{ secrets.PACKAGES_USERNAME }}
          NUGET_AUTH_TOKEN: ${{ secrets.PACKAGES_PATTOKEN }}

      - name: Build tests
        run: dotnet build tests/SqlRace.Examples.Tests/SqlRace.Examples.Tests.csproj --no-restore --configuration Release

      # NOTE: MOST tests are not executed in CI. Several of them initialise the SQL
      # Race runtime via SqlRaceBootstrapper, which requires a SQL Race licence that
      # the CI runner does not have (LicenceException). Run `dotnet test` locally on
      # a licenced machine to execute the full suite, or scripts/run-examples-e2e.ps1
      # for the runtime checks across C#, Python and MATLAB.
      #
      # The snippet compilation tests are the exception: they compile every snippet
      # against the real SQL Race assemblies using Roslyn, which is a metadata-only
      # operation needing no licence. They are the early warning that a new
      # MESL.SQLRace.API release has broken the code we hand customers.
      - name: Verify snippets compile against SQL Race
        # Advisory for now - three function snippets have a known pre-existing
        # failure. Remove continue-on-error once those are fixed so that a genuine
        # API break fails the build.
        continue-on-error: true
        run: >
          dotnet test tests/SqlRace.Examples.Tests/SqlRace.Examples.Tests.csproj
          --no-build --configuration Release
          --filter "FullyQualifiedName~SnippetCompilation"
